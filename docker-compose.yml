services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://resourcer:resourcer123@postgres:5432/resourcer?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=resourcer
      - POSTGRES_PASSWORD=resourcer123
      - POSTGRES_DB=resourcer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resourcer -d resourcer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: